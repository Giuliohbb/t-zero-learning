# PPO — LunarLander-v3, config FINAL da Parte 4 (resolve nas seeds 1 e 2).
# Mudanças em relação a configs/ppo_lunarlander.yml (justificativas no relatório):
#   total_timesteps 1M -> 2M
#   num_envs 4 -> 16, ppo.num_steps 128 -> 512   (batch 512 -> 8192)
#   ppo.num_minibatches 4 -> 32                   (minibatch 128 -> 256)
#   ppo.update_epochs 4 -> 10
#   ppo.learning_rate 2.5e-4 -> 1e-3
#
# Every key maps onto a dataclass field (unknown keys fail at startup):
#   run-level keys -> core/base_config.py::RunConfig (incl. network,
#                     network_kwargs: the network class and its constructor args)
#   ppo:           -> algorithms/ppo.py::PPOConfig
# Keys left out keep the dataclass defaults.
#
#   python train.py --config ppo_lunarlander_final --override seed=2

algorithm: ppo
env_id: LunarLander-v3
seed: 1
cuda: false             # CPU is plenty for this env
total_timesteps: 2000000
num_envs: 16            # batch = 16 * 512 = 8192

track: true             # log metrics to Weights & Biases (set WANDB_PROJECT in .env)
capture_video: true     # record a video during the final evaluation
save_model: true        # write model.pt + run a final evaluation
checkpoint_every: 0

network: DiscreteActorCritic   # your network from the A2C assignment
network_kwargs:                # passed to its constructor — see its signature
  activation: Tanh
  hidden_layers_size: 64

ppo:
  learning_rate: 1.0e-3
  anneal_lr: true
  num_steps: 512        # rollout length per env
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 32   # minibatch = 8192 / 32 = 256
  update_epochs: 10     # passes over each rollout
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
